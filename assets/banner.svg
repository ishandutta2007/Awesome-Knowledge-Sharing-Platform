<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>

    <linearGradient id="subheadGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Layer Background -->
  <rect width="1200" height="350" fill="url(#bgGrad)" rx="16" />

  <!-- Dynamic Glowing Mesh & Abstract Background Elements (Behind Text) -->
  <g opacity="0.3">
    <!-- Animated SVG pulses / geometric rings -->
    <circle cx="200" cy="175" r="140" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="8 8">
      <animateTransform attributeName="transform" type="rotate" from="0 200 175" to="360 200 175" dur="40s" repeatCount="indefinite" />
    </circle>
    <circle cx="1000" cy="175" r="160" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="12 12">
      <animateTransform attributeName="transform" type="rotate" from="360 1000 175" to="0 1000 175" dur="50s" repeatCount="indefinite" />
    </circle>
    <circle cx="600" cy="175" r="220" fill="none" stroke="#0ea5e9" stroke-width="1.5" opacity="0.4">
      <animate attributeName="r" values="200;240;200" dur="8s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Network Nodes & Connecting Lines (Background) -->
  <g opacity="0.25" stroke="url(#cyanPurple)" stroke-width="1.5">
    <line x1="100" y1="80" x2="250" y2="150" />
    <line x1="250" y1="150" x2="180" y2="280" />
    <line x1="180" y1="280" x2="350" y2="220" />
    <line x1="1050" y1="90" x2="920" y2="180" />
    <line x1="920" y1="180" x2="1020" y2="290" />
    <line x1="820" y1="110" x2="920" y2="180" />
  </g>

  <!-- Floating Glowing Spheres -->
  <g filter="url(#glow)">
    <circle cx="100" cy="80" r="6" fill="#38bdf8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="250" cy="150" r="8" fill="#818cf8">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="180" cy="280" r="5" fill="#c084fc">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="1050" cy="90" r="7" fill="#38bdf8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="920" cy="180" r="9" fill="#c084fc">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="4.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="1020" cy="290" r="6" fill="#818cf8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Foreground Content Block (Ensured clear contrast & foreground position) -->
  <g text-anchor="middle">
    <!-- Icon / Symbol -->
    <g transform="translate(600, 75)" filter="url(#glow)">
      <!-- Knowledge/Book/Network Badge Icon -->
      <rect x="-30" y="-30" width="60" height="60" rx="16" fill="url(#cyanPurple)" opacity="0.9" />
      <path d="M-12 -10 L0 -16 L12 -10 L12 12 L0 6 L-12 12 Z M0 -16 L0 6" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Main Title -->
    <text x="600" y="170" fill="url(#textGrad)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="46" letter-spacing="1.5" filter="url(#glow)">
      📚 AWESOME KNOWLEDGE SHARING PLATFORM 🚀
    </text>

    <!-- Decorative Gradient Separator Line -->
    <rect x="400" y="195" width="400" height="4" rx="2" fill="url(#cyanPurple)" filter="url(#glow)" />

    <!-- Subtitle -->
    <text x="600" y="240" fill="url(#subheadGrad)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="20" letter-spacing="0.8">
      Curated Ecosystem of SaaS Solutions &amp; Open-Source Knowledge Bases
    </text>

    <!-- Feature Tags / Pills -->
    <g transform="translate(600, 280)">
      <!-- Tag 1: Team Wikis -->
      <g transform="translate(-210, 0)">
        <rect x="-60" y="-14" width="120" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
        <text y="4" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">💡 Team Wikis</text>
      </g>
      <!-- Tag 2: Open Source -->
      <g transform="translate(-70, 0)">
        <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
        <text y="4" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">⚡ Open Source</text>
      </g>
      <!-- Tag 3: Enterprise Docs -->
      <g transform="translate(80, 0)">
        <rect x="-70" y="-14" width="140" height="28" rx="14" fill="#1e293b" stroke="#c084fc" stroke-width="1.5" />
        <text y="4" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">🏢 Enterprise Docs</text>
      </g>
      <!-- Tag 4: Self-Hosted -->
      <g transform="translate(230, 0)">
        <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#1e293b" stroke="#34d399" stroke-width="1.5" />
        <text y="4" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">🔒 Self-Hosted</text>
      </g>
    </g>
  </g>
</svg>
